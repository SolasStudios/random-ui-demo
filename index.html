<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Random UI Demo</title>
<style>
  :root { --bg:#10131a; --card:#1a1f2b; --fg:#e8ecf4; --accent:#6c8cff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--fg); padding:24px; }
  h1 { margin:0 0 4px; } p.sub { margin:0 0 20px; opacity:.7; }
  .bar { display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
  .card { min-width:0; overflow:hidden; background:var(--card); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .card h3 { margin:0; font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; opacity:.6; }
  button { background:var(--accent); color:#fff; border:0; border-radius:10px; padding:10px 14px; font-size:1rem; cursor:pointer; }
  button:active { transform:scale(.96); }
  button.ghost { background:transparent; border:1px solid var(--accent); color:var(--accent); }
  input[type=range] { width:100%; }
  .scroll { height:120px; overflow:auto; background:#0e1118; border-radius:10px; padding:8px; }
  .scroll div { padding:4px 0; border-bottom:1px solid #222a3a; }
  .out { font-variant-numeric:tabular-nums; font-size:1.4rem; }
  select { background:#0e1118; color:var(--fg); border:1px solid #2a3350; border-radius:10px; padding:8px; font-size:1rem; }
  .grid3 button { min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .swatch { height:60px; border-radius:10px; transition:background .2s; }
</style>
</head>
<body>
<h1>Random UI Demo</h1>
<p class="sub">Buttons, sliders, scrolls, toggles. Every load is different.</p>
<div class="bar">
  <button id="reshuffle">Reshuffle everything</button>
  <button class="ghost" id="theme">Random accent</button>
</div>
<div class="grid" id="grid"></div>
<script>
const rnd = (a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick = a=>a[rnd(0,a.length-1)];
const pickN = (a,n)=>[...a].sort(()=>Math.random()-.5).slice(0,Math.min(n,a.length));
const textFor = (h,s,l)=>l>58?'#10131a':'#fff';
const words = ["maple","orbit","ember","quartz","drift","nova","pixel","harbor","lantern","cobalt","fable","zephyr"];
const grid = document.getElementById('grid');

function card(title, build){
  const c = document.createElement('div'); c.className='card';
  c.innerHTML = `<h3>${title}</h3>`; build(c); grid.appendChild(c);
}
function render(){
  grid.innerHTML='';
  card('Counter button', c=>{
    let n=rnd(0,50); const out=document.createElement('div'); out.className='out'; out.textContent=n;
    const b=document.createElement('button'); b.textContent=`+${rnd(1,9)}`;
    const step=parseInt(b.textContent.slice(1));
    b.onclick=()=>{n+=step; out.textContent=n;};
    c.append(out,b);
  });
  card('Random word button', c=>{
    const out=document.createElement('div'); out.className='out'; out.textContent=pick(words);
    const b=document.createElement('button'); b.textContent='Roll';
    b.onclick=()=>out.textContent=pick(words)+' '+pick(words);
    c.append(out,b);
  });
  card('Slider', c=>{
    const out=document.createElement('div'); out.className='out';
    const min=rnd(0,20), max=min+rnd(30,200), s=document.createElement('input');
    s.type='range'; s.min=min; s.max=max; s.value=rnd(min,max);
    s.value=s.value; out.textContent=s.value; s.oninput=()=>out.textContent=s.value; c.append(out,s);
  });
  card('Color mixer', c=>{
    const sw=document.createElement('div'); sw.className='swatch';
    const v=[rnd(0,255),rnd(0,255),rnd(0,255)];
    const upd=()=>sw.style.background=`rgb(${v})`; upd(); c.append(sw);
    ['R','G','B'].forEach((n,i)=>{
      const s=document.createElement('input'); s.type='range'; s.min=0; s.max=255; s.value=v[i];
      s.oninput=()=>{v[i]=+s.value; upd();}; c.append(s);
    });
  });
  card('Scroll list', c=>{
    const box=document.createElement('div'); box.className='scroll';
    for(let i=0;i<rnd(25,60);i++){ const d=document.createElement('div'); d.textContent=`${i+1}. ${pick(words)} ${rnd(100,999)}`; box.append(d); }
    c.append(box);
  });
  card('Toggles', c=>{
    for(let i=0;i<3;i++){
      const l=document.createElement('label'); const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=Math.random()>.5;
      l.append(cb,' '+pick(words)); c.append(l);
    }
  });
  card('Dropdown', c=>{
    const sel=document.createElement('select');
    pickN(words,rnd(3,7)).forEach(w=>{ const o=document.createElement('option'); o.textContent=w; sel.append(o); });
    const out=document.createElement('div'); out.textContent='Selected: '+sel.value; sel.onchange=()=>out.textContent='Selected: '+sel.value;
    c.append(sel,out);
  });
  card('Button grid', c=>{
    const wrap=document.createElement('div'); wrap.className='grid3'; wrap.style.cssText='display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px';
    for(let i=0;i<6;i++){ const b=document.createElement('button'); b.className=Math.random()>.5?'ghost':''; b.textContent=pick(words);
      b.onclick=()=>{ const h=rnd(0,360), l=rnd(30,80); b.style.background=`hsl(${h} 70% ${l}%)`; b.style.color=textFor(h,70,l); b.style.borderColor='transparent'; }; wrap.append(b); }
    c.append(wrap);
  });
}
document.getElementById('reshuffle').onclick=render;
document.getElementById('theme').onclick=()=>document.documentElement.style.setProperty('--accent',`hsl(${rnd(0,360)} 80% 62%)`);
render();
</script>
</body>
</html>
